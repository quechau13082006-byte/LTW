<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Tiêu đề có block title để trang con ghi đè -->
    <title>{% block title %}Book Search{% endblock %}</title>
    <!-- CSS Bootstrap 4 để hiển thị đẹp -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Thanh điều hướng Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <!-- Logo và Tên thương hiệu -->
        <a class="navbar-brand d-flex align-items-center" href="/">
            <!-- Biểu tượng cuốn sách đơn giản (SVG) -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="white" class="mr-2" viewBox="0 0 16 16">
              <path d="M1 2.828c.885-.37 2.154-.769 3.388-.893 1.33-.134 2.458.156 3.112.752v9.746c-.935-.53-2.12-.603-3.213-.493-1.18.12-2.37.461-3.287.811V2.828zm7.5-.141c.654-.596 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492V2.687zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783z"/>
            </svg>
            <span class="text-success font-weight-bold">BOOKR</span>
        </a>

        <div class="collapse navbar-collapse">
            <ul class="navbar-nav mr-auto">
                <li class="nav-item"><a class="nav-link text-white" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="#">Logout</a></li>
            </ul>

            <!-- Form tìm kiếm góc trên bên phải -->
            <form class="form-inline my-2 my-lg-0" action="{% url 'book_search' %}" method="get">
                <input class="form-control mr-sm-2"
                       type="search"
                       name="search"
                       placeholder="Search"
                       value="{{ search_text }}"
                       minlength="3"
                       required>
                <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
            </form>
        </div>
    </nav>


    <div class="container-fluid mt-3" style="min-height: 50vh;">
       <!-- Vòng lặp hiển thị các thông điệp (messages) của Django -->
       {% if messages %}
           {% for message in messages %}
               <div class="alert alert-{% if message.level_tag == 'error' %}danger{% else %}{{ message.level_tag }}{% endif %}" role="alert">
                   {{ message }}
               </div>
           {% endfor %}
       {% endif %}

       <!-- Khối content để các trang con đổ dữ liệu vào -->
       {% block content %}
       {% endblock %}
    </div>

    <!-- Chân trang (Footer) -->
    <footer class="mt-5 pb-4 text-center">
        <p class="mb-1">© 2022 Copyright: <a href="#">Packt Publications</a></p>
        <p class="mb-3">Website by: Packt Publications</p>
        <p>Contact information: <a href="mailto:email@example.com">email@example.com</a></p>
    </footer>
</body>
</html>
